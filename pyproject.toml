[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semi-auto-probe"
version = "0.1.0"
description = "RS-232 three-axis motor controller scaffold with USB camera preview."
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
  "opencv-python>=4.8",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pyvisa>=1.14",
  "qcodes>=0.45",
  "gdstk>=0.9",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pyside6>=6.7",
  "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
dp100 = ["pythonnet>=3.0"]

[project.scripts]
semi-auto-probe = "semi_auto_probe.app:main"
semi-auto-probe-test = "semi_auto_probe.cli:main"
semi-auto-probe-web = "semi_auto_probe.web_app:main"
semi-auto-probe-measure = "semi_auto_probe.measure_debug:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semi_auto_probe = ["assets/*", "web/README.md", "web/static/*"]
